<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Morning Letter</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #cce7ff, #e6f2ff);
  font-family: "Segoe UI", sans-serif;
  overflow: hidden;
}

.letter {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  text-align: center;
  width: 320px;
  position: relative;
}

img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 15px;
}

h1 {
  color: #3399ff;
  font-size: 20px;
  margin-bottom: 20px;
}

.btn {
  border: none;
  padding: 12px 20px;
  margin: 10px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.25s ease;
}

.yes {
  background: #66b3ff;
  color: white;
}

.no {
  background: #ccc;
}

#result {
  margin-top: 15px;
  font-size: 18px;
  color: #3399ff;
  display: none;
}

/* เอฟเฟกต์ */
.float {
  position: absolute;
  font-size: 22px;
  animation: floatUp 2s ease forwards;
}

.pop {
  position: absolute;
  font-size: 20px;
  animation: explode 0.8s ease forwards;
}

@keyframes floatUp {
  0% {opacity:1; transform:translateY(0);}
  100% {opacity:0; transform:translateY(-150px) scale(1.5);}
}

@keyframes explode {
  0% {transform: translate(0,0) scale(1); opacity:1;}
  100% {transform: translate(var(--x), var(--y)) scale(1.5); opacity:0;}
}
</style>
</head>

<body>

<div class="letter" id="letter">

  <!-- รูป + fallback -->
  <img src="image.jpg" onerror="this.src='https://picsum.photos/400/200'">

  <h1>มอนิ่งนะครับ คุณนายตื่นเช้า ☀️</h1>

  <button class="btn yes" id="yesBtn" onclick="sayYes(event)">มอนิ่งค่ะ</button>
  <button class="btn no" id="noBtn" onclick="sayNo()">ไม่</button>

  <div id="result">มอนิ่งค่ะ 💙</div>
</div>

<script>
let noCount = 0;
let noScale = 1;
let yesScale = 1;

function sayYes(e) {
  document.getElementById("result").style.display = "block";

  // ✅ ปุ่ม "มอนิ่งค่ะ" ใหญ่ขึ้น
  const yesBtn = document.getElementById("yesBtn");
  yesScale += 0.2;
  yesBtn.style.transform = `scale(${yesScale})`;

  // ลอย
  for (let i = 0; i < 8; i++) createFloat();

  // pop
  createPop(e);
}

function sayNo() {
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  noCount++;

  // ❌ ปุ่ม "ไม่" เล็กลง
  noScale -= 0.2;
  noBtn.style.transform = `scale(${noScale})`;

  // ✅ ปุ่ม "มอนิ่งค่ะ" ใหญ่ขึ้นด้วย
  yesScale += 0.2;
  yesBtn.style.transform = `scale(${yesScale})`;

  if (noCount >= 5) {
    noBtn.style.display = "none";
  }
}

function createFloat() {
  const el = document.createElement("div");
  el.className = "float";
  el.innerText = Math.random() > 0.5 ? "💙" : "☀️";

  const letter = document.getElementById("letter");
  el.style.left = Math.random() * 260 + "px";
  el.style.top = "150px";

  letter.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function createPop(e) {
  const rect = e.target.getBoundingClientRect();

  for (let i = 0; i < 10; i++) {
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerText = "💙";

    const angle = Math.random() * 2 * Math.PI;
    const distance = 80 + Math.random() * 40;

    pop.style.setProperty("--x", Math.cos(angle)*distance + "px");
    pop.style.setProperty("--y", Math.sin(angle)*distance + "px");

    pop.style.left = rect.left + rect.width/2 + "px";
    pop.style.top = rect.top + rect.height/2 + "px";

    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 800);
  }
}
</script>

</body>
</html>
