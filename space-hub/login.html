<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Space Login</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
.login-box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:350px;
    padding:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    text-align:center;
    z-index:10;
}

.login-box h2{
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    outline:none;
}

.login-box button{
    width:100%;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="stars"></div>

<div class="login-box">

    <h2>🚀 SPACE ACCESS</h2>

    <input
        type="text"
        id="instagram"
        placeholder="Instagram Username">
<input
    type="text"
    id="webhookLogin"
    placeholder="https://discord.com/api/webhooks/1517881955096596510/ZWe-1ruecPqVwnjz7V0XQzyfsby7hjsuzvgsT93SQI7Fu9TO6YtIw06r26XEPohUqv5m">

    <button onclick="login()">
        VERIFY & ENTER
    </button>

</div>

<script>
function login(){

    const ig = document.getElementById("instagram").value.trim();

    if(ig === ""){
        alert("กรุณากรอกชื่อ Instagram");
        return;
    }

    // เก็บชื่อ IG ไว้ในเบราว์เซอร์
    localStorage.setItem("instagram", ig);

    // ภายหลังค่อยเพิ่ม Webhook ตรงนี้

    window.location.href = "home.html";
}
</script>

</body>
</html>
