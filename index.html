<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Morning Letter</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #cce7ff, #e6f2ff);
  font-family: sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

/* ซอง */
.envelope {
  width: 220px;
  height: 150px;
  background: #66b3ff;
  border-radius: 10px;
  margin: 0 auto 10px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-weight: bold;
}

.flap {
  position: absolute;
  top: 0;
  border-left: 110px solid transparent;
  border-right: 110px solid transparent;
  border-bottom: 75px solid #3399ff;
  transform-origin: top;
  transition: 0.5s;
}

.envelope.open .flap {
  transform: rotateX(180deg);
}

/* เด้ง + สั่น */
.bounce { animation: bounce 0.4s; }
.shake { animation: shake 0.4s; }

@keyframes bounce {
  50% { transform: scale(1.1); }
}
@keyframes shake {
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
}

/* ปุ่มเปิด */
.openBtn {
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  background: #3399ff;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

/* จดหมาย */
.letter {
  width: 320px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
  display: none;
  margin-top: 20px;
}

img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 15px;
}

h1 { color: #3399ff; font-size: 20px; }

.btn {
  border: none;
  padding: 12px 18px;
  margin: 10px;
  border-radius: 12px;
  cursor: pointer;
}

.yes { background: #66b3ff; color: white; }
.no { background: #ccc; }

#result {
  display: none;
  color: #3399ff;
  margin-top: 10px;
}

/* เอฟเฟกต์ */
.float {
  position: absolute;
  animation: floatUp 2s forwards;
}
.pop {
  position: absolute;
  animation: explode 0.8s forwards;
}

@keyframes floatUp {
  to { transform: translateY(-150px); opacity: 0; }
}
@keyframes explode {
  to { transform: translate(var(--x), var(--y)); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">

  <!-- ซอง + ชื่อ -->
  <div class="envelope" id="env">
    จดหมายถึงมะตาว 💌
    <div class="flap"></div>
  </div>

  <button id="openBtn" class="openBtn" onclick="openLetter()">เปิดจดหมาย</button>

  <div class="letter" id="letter">

    <img src="https://images.unsplash.com/photo-1544568100-847a948585b9?q=80&w=800">

    <!-- ขึ้นก่อน -->
    <h1>มอนิ่งนะค้าบ ☀️</h1>

    <!-- ขึ้นทีหลัง -->
    <div id="result">ตื่นมาขอให้เป็นวันที่สดใสนะค้าบ 💙</div>

    <button class="btn yes" id="yesBtn" onclick="yesClick(event)">มอนิ่งค่ะ</button>
    <button class="btn no" id="noBtn" onclick="noClick()">ไม่</button>

  </div>

</div>

<script>
let yesScale = 1;
let noScale = 1;
let noCount = 0;

function openLetter(){
  const env = document.getElementById("env");

  document.getElementById("openBtn").style.display = "none";

  env.classList.add("bounce","shake");

  setTimeout(()=>{
    env.classList.remove("bounce","shake");
    env.classList.add("open");

    setTimeout(()=>{
      document.getElementById("letter").style.display="block";
      env.style.display="none";
    },400);

  },400);
}

function yesClick(e){
  document.getElementById("result").style.display = "block";

  yesScale += 0.2;
  document.getElementById("yesBtn").style.transform = `scale(${yesScale})`;

  for(let i=0;i<8;i++){
    let el=document.createElement("div");
    el.className="float";
    el.innerText=Math.random()>0.5?"💙":"☀️";
    el.style.left=Math.random()*300+"px";
    el.style.top="150px";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }

  createPop(e);
}

function noClick(){
  noCount++;

  noScale -= 0.2;
  document.getElementById("noBtn").style.transform=`scale(${noScale})`;

  yesScale += 0.25;
  document.getElementById("yesBtn").style.transform=`scale(${yesScale})`;

  if(noCount>=5){
    document.getElementById("noBtn").style.display="none";
  }
}

function createPop(e){
  const rect=e.target.getBoundingClientRect();

  for(let i=0;i<10;i++){
    let p=document.createElement("div");
    p.className="pop";
    p.innerText="💙";

    let a=Math.random()*Math.PI*2;
    let d=80+Math.random()*40;

    p.style.setProperty("--x",Math.cos(a)*d+"px");
    p.style.setProperty("--y",Math.sin(a)*d+"px");

    p.style.left=rect.left+"px";
    p.style.top=rect.top+"px";

    document.body.appendChild(p);
    setTimeout(()=>p.remove(),800);
  }
}
</script>

</body>
</html>
