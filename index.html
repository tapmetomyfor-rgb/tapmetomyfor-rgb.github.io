<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Morning Letter</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #cce7ff, #e6f2ff);
  font-family: "Segoe UI", sans-serif;
  overflow: hidden;
}

.letter {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  text-align: center;
  width: 320px;
  animation: fadeIn 1s ease;
  position: relative;
}

img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 15px;
}

h1 {
  color: #3399ff;
  font-size: 20px;
  margin-bottom: 20px;
}

.btn {
  border: none;
  padding: 12px 20px;
  margin: 10px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.3s ease;
  position: relative;
}

.yes {
  background: #66b3ff;
  color: white;
}

.no {
  background: #ccc;
}

#result {
  margin-top: 15px;
  font-size: 18px;
  color: #3399ff;
  display: none;
}

/* ลอยขึ้น */
.float {
  position: absolute;
  font-size: 24px;
  animation: floatUp 2s ease forwards;
  pointer-events: none;
}

/* POP กระจาย */
.pop {
  position: absolute;
  font-size: 20px;
  pointer-events: none;
  animation: explode 0.8s ease forwards;
}

@keyframes floatUp {
  0% {opacity:1; transform:translateY(0);}
  100% {opacity:0; transform:translateY(-150px) scale(1.5);}
}

@keyframes explode {
  0% {
    transform: translate(0,0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(var(--x), var(--y)) scale(1.5);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="letter" id="letter">

  <img src="https://cdn.discordapp.com/attachments/1498586128591093880/1500155554038026290/IMG_20260502_222210_763.jpg">

  <h1>มอนิ่งนะครับ คุณนายตื่นเช้า ☀️</h1>

  <button class="btn yes" id="yesBtn" onclick="sayYes(event)">มอนิ่งค่ะ</button>
  <button class="btn no" id="noBtn" onclick="sayNo()">ไม่</button>

  <div id="result">มอนิ่งค่ะ 💙</div>
</div>

<script>
let noCount = 0;
let scale = 1;

function sayYes(e) {
  document.getElementById("result").style.display = "block";

  // ลอยขึ้น
  for (let i = 0; i < 10; i++) {
    createFloat();
  }

  // POP รอบปุ่ม
  createPop(e);
}

function createFloat() {
  const el = document.createElement("div");
  el.className = "float";
  el.innerText = Math.random() > 0.5 ? "💙" : "☀️";

  const letter = document.getElementById("letter");
  el.style.left = Math.random() * 250 + "px";
  el.style.top = "150px";

  letter.appendChild(el);

  setTimeout(() => el.remove(), 2000);
}

function createPop(e) {
  const btn = e.target;
  const rect = btn.getBoundingClientRect();

  for (let i = 0; i < 12; i++) {
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.innerText = "💙";

    // กระจายเป็นวง
    const angle = Math.random() * 2 * Math.PI;
    const distance = 80 + Math.random() * 40;

    const x = Math.cos(angle) * distance + "px";
    const y = Math.sin(angle) * distance + "px";

    pop.style.setProperty("--x", x);
    pop.style.setProperty("--y", y);

    pop.style.left = rect.left + rect.width/2 + "px";
    pop.style.top = rect.top + rect.height/2 + "px";

    document.body.appendChild(pop);

    setTimeout(() => pop.remove(), 800);
  }
}

function sayNo() {
  const btn = document.getElementById("noBtn");
  noCount++;
  scale -= 0.2;
  btn.style.transform = `scale(${scale})`;

  if (noCount >= 5) {
    btn.style.display = "none";
  }
}
</script>

</body>
</html>
