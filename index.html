<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Homework AI Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', 'Orbitron', sans-serif; }
        .space-bg {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f0720 50%, #05020c 100%);
            position: relative;
            overflow-x: hidden;
        }
        /* เอฟเฟกต์แสงเนบิวลาวิบวับหลังบ้าน */
        .nebula {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(147,51,234,0.15) 0%, rgba(6,182,212,0.1) 50%, rgba(0,0,0,0) 100%);
            top: -10%; left: -10%;
            z-index: 0;
            pointer-events: none;
        }
        .nebula-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, rgba(147,51,234,0.05) 50%, rgba(0,0,0,0) 100%);
            bottom: -20%; right: -10%;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="space-bg text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="nebula"></div>
    <div class="nebula-2"></div>

    <div class="max-w-xl w-full bg-[#0d091d]/80 backdrop-blur-2xl rounded-3xl shadow-[0_0_50px_rgba(147,51,234,0.2)] border border-purple-500/30 p-6 md:p-10 relative z-10">
        
        <div class="text-center mb-8 relative">
            <div class="inline-block p-4 bg-gradient-to-br from-purple-500/20 to-cyan-500/20 rounded-full mb-4 border border-cyan-500/40 shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                <i class="fa-solid fa-shuttle-space text-4xl text-cyan-400 animate-bounce"></i>
            </div>
            <h1 class="text-3xl font-black tracking-wider bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-purple-500 bg-clip-text text-transparent uppercase font-['Orbitron']">
                GALAXY HW AI
            </h1>
            <p class="text-purple-300/70 mt-2 text-xs font-light tracking-widest uppercase">ศูนย์บัญชาการทำการบ้านข้ามดวงดาว</p>
        </div>

        <form id="hwForm" class="space-y-5">
            <div>
                <label class="text-xs font-semibold tracking-wider text-cyan-400/80 ml-1 block mb-2 uppercase"><i class="fa-solid fa-planet-ringed mr-1"></i> พิกัดวิชา (Subject)</label>
                <select id="subject" class="w-full bg-[#130d2a] border border-purple-500/30 rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition text-slate-200 cursor-pointer shadow-inner">
                    <option value="ทั่วไป / อวกาศ">ทุกวิชา / ทั่วไป</option>
                    <option value="คณิตศาสตร์">คณิตศาสตร์ (Quantum Math)</option>
                    <option value="วิทยาศาสตร์">วิทยาศาสตร์ (Cosmology)</option>
                    <option value="ภาษาอังกฤษ">ภาษาอังกฤษ (Universal Language)</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-semibold tracking-wider text-cyan-400/80 ml-1 block mb-2 uppercase"><i class="fa-solid fa-terminal mr-1"></i> ป้อนข้อมูลโจทย์ (Data Input)</label>
                <textarea id="question" rows="3" placeholder="พิมพ์โจทย์ที่ต้องการให้ยานแม่คำนวณ..." class="w-full bg-[#130d2a] border border-purple-500/30 rounded-2xl px-4 py-3.5 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition resize-none placeholder-purple-400/30 text-slate-200"></textarea>
            </div>

            <div id="dropZone" class="group border-2 border-dashed border-purple-500/30 bg-[#130d2a]/50 rounded-2xl p-6 text-center hover:border-cyan-400 hover:bg-cyan-500/5 transition cursor-pointer shadow-lg">
                <input type="file" id="fileInput" accept="image/*" class="hidden">
                <div id="uploadUi">
                    <i class="fa-solid fa-satellite-dish text-2xl text-purple-400 group-hover:text-cyan-400 mb-2 transition-transform group-hover:rotate-12"></i>
                    <p class="text-sm text-purple-300/70 group-hover:text-cyan-300">สแกนรูปภาพโจทย์ (คลิกเพื่ออัปโหลด)</p>
                </div>
                <img id="preview" class="hidden max-h-40 mx-auto rounded-xl border border-cyan-500/50 shadow-[0_0_20px_rgba(6,182,212,0.3)]">
            </div>

            <button type="submit" id="btn" class="w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-500 hover:shadow-[0_0_30px_rgba(147,51,234,0.6)] py-4 rounded-2xl font-bold tracking-widest text-white transition-all duration-300 flex items-center justify-center gap-2 border border-purple-400/30">
                <i class="fa-solid fa-atom animate-spin-slow"></i> <span>LAUNCH AI PROCESS</span>
            </button>
        </form>

        <div id="status" class="hidden mt-6 text-center text-cyan-400 text-sm tracking-widest font-['Orbitron']">
            <i class="fa-solid fa-meteor animate-spin mr-2"></i> ANALYZING DEEP SPACE DATA...
        </div>

        <div id="resultBox" class="hidden mt-8 bg-[#130d2a] p-5 rounded-2xl border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.1)]">
            <h2 class="text-cyan-400 font-bold mb-3 flex items-center gap-2 text-sm tracking-wider uppercase">
                <i class="fa-solid fa-satellite"></i> ผลการคำนวณจากยานแม่:
            </h2>
            <div id="ans" class="text-slate-300 text-sm leading-relaxed overflow-y-auto max-h-60 border-t border-purple-500/20 pt-3 whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const uploadUi = document.getElementById('uploadUi');
        let base64Image = null;

        document.getElementById('dropZone').onclick = () => fileInput.click();

        fileInput.onchange = e => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    base64Image = reader.result;
                    preview.src = reader.result;
                    preview.classList.remove('hidden');
                    uploadUi.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('hwForm').onsubmit = async e => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');

            btn.disabled = true;
            status.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const res = await fetch('/api/homework', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subject: document.getElementById('subject').value,
                        question: document.getElementById('question').value,
                        image: base64Image
                    })
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('ans').innerText = data.answer;
                    resultBox.classList.remove('hidden');
                } else { alert("เกิดข้อผิดพลาดในการเชื่อมต่อสถานีอวกาศ!"); }
            } catch (err) { alert("ขาดการเชื่อมต่อจากสัญญาณดาวเทียม!"); }
            finally {
                btn.disabled = false;
                status.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
