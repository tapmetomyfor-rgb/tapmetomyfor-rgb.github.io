<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Morning Letter</title>

<!-- ฟอนต์สวย -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #cce7ff, #e6f2ff);
  font-family: 'Kanit', sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

/* ซอง */
.envelope {
  width: 220px;
  height: 150px;
  background: #66b3ff;
  border-radius: 10px;
  margin: 0 auto 10px;
  position: relative;
}

/* ✨ ข้อความหน้าซอง */
.label {
  position: absolute;
  width: 100%;
  top: 60%;
  transform: translateY(-50%);
  text-align: center;
  color: white;
  font-weight: 600;
  font-size: 16px;
  z-index: 2; /* สำคัญ! ให้อยู่บนฝา */
}

/* ฝาซอง */
.flap {
  position: absolute;
  top: 0;
  border-left: 110px solid transparent;
  border-right: 110px solid transparent;
  border-bottom: 75px solid #3399ff;
  transform-origin: top;
  transition: 0.5s;
  z-index: 1;
}

.envelope.open .flap {
  transform: rotateX(180deg);
}

/* เด้ง + สั่น */
.bounce { animation: bounce 0.4s; }
.shake { animation: shake 0.4s; }

@keyframes bounce {
  50% { transform: scale(1.1); }
}
@keyframes shake {
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
}

/* ปุ่ม */
.openBtn {
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  background: #3399ff;
  color: white;
  cursor: pointer;
}

/* จดหมาย */
.letter {
  width: 320px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  display: none;
  margin-top: 20px;
}

/* ที่เหลือเหมือนเดิม */
img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 15px;
}

h1 { color: #3399ff; }

.btn {
  border: none;
  padding: 12px 18px;
  margin: 10px;
  border-radius: 12px;
  cursor: pointer;
}

.yes { background: #66b3ff; color: white; }
.no { background: #ccc; }

#result {
  opacity: 0;
  transform: translateY(10px);
  transition: 0.8s;
  color: #3399ff;
}

#result.show {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="container">

  <div class="envelope" id="env">
    <!-- ✨ ข้อความไม่โดนทับแล้ว -->
    <div class="label">จดหมายถึงมะตาว 💌</div>
    <div class="flap"></div>
  </div>

  <button id="openBtn" class="openBtn" onclick="openLetter()">เปิดจดหมาย</button>

  <div class="letter" id="letter">

    <img src="https://images.unsplash.com/photo-1544568100-847a948585b9?q=80&w=800">

    <h1>มอนิ่งนะค้าบ ☀️</h1>

    <div id="result">ตื่นมาขอให้เป็นวันที่สดใสนะค้าบ 💙</div>

    <button class="btn yes" id="yesBtn" onclick="yesClick()">มอนิ่งค่ะ</button>
    <button class="btn no" id="noBtn" onclick="noClick()">ไม่</button>

  </div>

</div>

<script>
let yesScale=1,noScale=1,noCount=0;

function openLetter(){
  env.classList.add("bounce","shake");
  openBtn.style.display="none";

  setTimeout(()=>{
    env.classList.remove("bounce","shake");
    env.classList.add("open");

    setTimeout(()=>{
      letter.style.display="block";
      env.style.display="none";
    },400);
  },400);
}

function yesClick(){
  result.classList.add("show");

  yesScale+=0.2;
  yesBtn.style.transform=`scale(${yesScale})`;
}

function noClick(){
  noCount++;
  noScale-=0.2;
  noBtn.style.transform=`scale(${noScale})`;

  yesScale+=0.25;
  yesBtn.style.transform=`scale(${yesScale})`;

  if(noCount>=5) noBtn.style.display="none";
}
</script>

</body>
</html>
